<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2BB6B7">
<meta name="robots" content="noindex, nofollow">
<style>html{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Clean Service Fahrzeug-App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Clean Service Scaramuzzo AG – Corporate Design (bewusst hell, ein Theme) */
:root{
  color-scheme:light;
  --cs:#2BB6B7; --cs-hover:#239FA0; --cs-ink:#177F80;
  --cs-1:#98C0D1; --cs-2:#71B6C6; --cs-3:#75C3C8; --cs-4:#9AD3D3; --cs-5:#60BEB3; --cs-6:#BEE2E9;
  --cs-tint:#EEF8F9;
  --ground:#F6F8F9; --surface:#FFFFFF; --surface-2:#F4F6F7; --ink:#2B3135; --muted:#6A7378; --line:#E2E7EA;
  --accent:var(--cs); --accent-ink:var(--cs-ink); --accent-soft:var(--cs-tint); --on-accent:#FFFFFF;
  --danger:#B8433A; --danger-soft:#FBEDEB; --warn:#8A5D12; --warn-soft:#FBF3E2; --ok:#2F8A57; --ok-soft:#EAF6EF;
  --shadow:0 1px 2px rgba(43,49,53,.04),0 2px 8px rgba(43,49,53,.04);
  --r-s:8px; --r-m:12px;
  --font:"Brandon Text","Inter",Helvetica,Arial,sans-serif;
  --font-h:"Brandon Grotesque","Inter",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;padding-inline:16px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cs);outline-offset:2px}
.app{max-width:440px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip:rect(0 0 0 0)}
h1,h2,.q,.greet,.vmodel{font-family:var(--font-h)}

/* bars */
.top,.fbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);margin-inline:-16px;padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:14px;margin-right:auto;min-width:0}
.logo{display:block;height:40px;width:auto;max-width:100%;margin-block:2px}
.logo-ph{height:36px;padding:0 12px;border:1px dashed var(--cs-1);border-radius:6px;display:grid;place-items:center;color:var(--muted);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;white-space:nowrap;background:var(--surface)}
.brand-tx{font-size:13px;font-weight:600;color:var(--muted);padding-left:14px;border-left:1px solid var(--line);white-space:nowrap}
.who{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-s);padding:4px 10px 4px 4px;cursor:pointer;font-size:12px;color:var(--muted)}
.who i{font-style:normal;width:28px;height:28px;border-radius:6px;background:var(--cs);color:#fff;display:grid;place-items:center;font-weight:600;font-size:12px}
.iconbtn{width:44px;height:44px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none;color:var(--ink)}
.txtbtn{border:0;background:none;color:var(--muted);font-size:13px;cursor:pointer;padding:10px 4px}
.fbar-t{display:flex;flex-direction:column;gap:3px;margin-right:auto;min-width:0}
.fbar-t>span:first-child{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:3px;background:var(--line);overflow:hidden;margin-inline:-16px}
.prog i{display:block;height:100%;background:var(--cs);transition:width .25s ease}

.plate{display:inline-flex;align-items:center;gap:5px;background:#fff;color:#111;border:1.5px solid #111;border-radius:4px;padding:1px 5px;font:700 11.5px/1.35 var(--font);letter-spacing:.05em;white-space:nowrap;width:max-content}
.plate svg{width:9px;height:11px;flex:none}

.plate{display:inline-flex;align-items:center;gap:5px;background:#fff;color:#111;border:1.5px solid #111;border-radius:4px;padding:1px 5px;font:700 11.5px/1.35 Helvetica,Arial,sans-serif;letter-spacing:.05em;white-space:nowrap;width:max-content}
.plate svg{width:9px;height:11px;flex:none}

/* home */
.home{display:flex;flex-direction:column;gap:14px;padding-block:18px 28px}
.greet{margin:0;font-size:24px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.vcard{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);padding:16px 18px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.vcard>*{position:relative}
.vcard .shape{position:absolute;right:-30px;top:-40px;width:210px;height:170px;pointer-events:none}
.vcard-top{display:flex;justify-content:space-between;align-items:center}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.vcard .linkbtn{color:var(--cs-ink);border:1px solid var(--cs-4);background:var(--surface);border-radius:var(--r-s);padding:5px 12px;text-decoration:none;margin:0}
.vcard-main{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.vmodel{font-size:21px;font-weight:600;margin-bottom:6px}
.vmeta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.vnr{font-weight:600;font-size:12.5px;background:var(--cs-6);color:#1D5B66;padding:2px 8px;border-radius:6px}
.vkm{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}
.vkm .num{font-size:21px;font-weight:600;color:var(--ink)}
.vkm span:last-child{font-size:11px;color:var(--muted)}
.sect{font-size:11.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:10px 0 0;font-weight:600;font-family:var(--font)}
.tiles{display:grid;gap:10px}
.tile{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);text-align:left;cursor:pointer;box-shadow:var(--shadow);transition:border-color .15s,background .15s}
.tile:hover{border-color:var(--cs)}
.tile:active{background:var(--cs-tint)}
.tile-ic{width:48px;height:48px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--cs-tint);color:var(--cs)}
.tile-ic .ic{width:26px;height:26px}
.tile-tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.tile-l{font-weight:600;font-size:16px}
.tile-s{color:var(--muted);font-size:13px}
.tile>.ic:last-child{margin-left:auto;color:var(--cs)}
.t-danger.ev-ic{background:var(--danger-soft);color:var(--danger)}
.t-ok.ev-ic{background:var(--ok-soft);color:var(--ok)}
.t-warn.ev-ic{background:var(--warn-soft);color:var(--warn)}
.t-accent.ev-ic{background:var(--cs-tint);color:var(--cs-ink)}
.t-ink .tile-ic{background:var(--surface-2);color:var(--ink)}
.internal{border:1px solid var(--line);border-radius:var(--r-m);padding:10px;display:grid;gap:8px;background:var(--surface-2)}
.internal .tile{box-shadow:none;padding:12px}
.internal .tile-ic{width:40px;height:40px;background:var(--surface);border:1px solid var(--line)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.badge .ic{width:13px;height:13px}
.foot{font-size:12px;color:var(--muted);text-align:center;margin:8px 0 0}
.empty{color:var(--muted);font-size:14px;margin:0}

/* event list */
.evs{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.ev{display:flex;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.ev-ic{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;flex:none}
.ev-ic .ic{width:19px;height:19px}
.ev-b{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.ev-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.ev-h b{font-size:14px;font-weight:600}
.ev-d{font-size:13px}
.ev-m{font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ev-id{font-size:11px;color:var(--muted);letter-spacing:.04em}
.pill{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:999px;white-space:nowrap}
.p-sehrhoch{background:var(--danger);color:#fff}
.p-hoch{background:var(--danger-soft);color:var(--danger)}
.p-normal{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.dayh{font-size:12px;color:var(--muted);font-weight:600;margin:10px 0 2px}

/* flow */
.step{flex:1;display:flex;flex-direction:column;gap:14px;padding-top:20px;animation:in .2s ease}
@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}
.stepno{margin:0;font-size:11.5px;color:var(--cs-ink);letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.q{margin:0;font-size:24px;line-height:1.25;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.hint{margin:0;color:var(--muted);font-size:14px}
.hint b{color:var(--ink);font-weight:600}
.err{margin:0;background:var(--danger-soft);color:var(--danger);border:1px solid #F0CFCB;border-radius:var(--r-s);padding:10px 14px;font-size:14px;font-weight:500}
.warnbox{margin:0;background:var(--warn-soft);color:var(--warn);border-radius:var(--r-s);padding:10px 14px;font-size:13.5px}
.alarm{background:var(--danger-soft);color:var(--danger);border:1px solid #F0CFCB;border-radius:var(--r-s);padding:12px 14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start}
.alarm .ic{width:20px;height:20px;margin-top:1px}
.abar{position:sticky;bottom:0;margin-inline:-16px;margin-top:auto;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--surface);border-top:1px solid var(--line);z-index:4}
.primary{width:100%;min-height:52px;border:0;border-radius:var(--r-s);background:var(--cs);color:#fff;font-weight:600;font-size:16px;letter-spacing:.01em;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:background .15s}
.primary:hover{background:var(--cs-hover)}
.primary .ic{width:20px;height:20px;stroke-width:2.2}
.primary:disabled{opacity:.6;cursor:progress}
.secondary{width:100%;min-height:48px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface);color:var(--cs-ink);font-weight:600;cursor:pointer}
.secondary:hover:not(:disabled){border-color:var(--cs)}
.secondary:disabled{color:var(--muted);cursor:not-allowed}
.linkbtn{background:none;border:0;padding:6px 0;color:var(--cs-ink);font-size:13px;font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px;align-self:flex-start}

.big{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);padding:0 18px;cursor:text}
.big:focus-within{border-color:var(--cs);box-shadow:0 0 0 3px rgba(43,182,183,.15)}
.big.pnf{border-width:1.5px;border-radius:var(--r-s);padding:0 14px}
.big.pnf input{height:52px;font-size:20px;font-weight:600;text-align:center;letter-spacing:.12em}
.big.pnf input::placeholder{font-size:15px;font-weight:500;letter-spacing:.02em;color:#A9B3B8}
.big>.ic{color:var(--cs);flex:none}
.big input{flex:1;min-width:0;border:0;background:transparent;height:72px;font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;outline:none}
.big input::placeholder{color:#C9D1D5}
.unit{color:var(--muted);font-weight:600;font-size:17px}
.ppl{margin:0;font-size:14px;color:var(--muted)}
.ppl .bad{color:var(--warn);font-weight:600}

.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:64px;padding:12px 16px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);text-align:left;cursor:pointer;transition:border-color .15s}
.opt:hover{border-color:var(--cs-4)}
.opt.on{border-color:var(--cs);background:var(--cs-tint)}
.opt-ic{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;flex:none;background:var(--cs-tint);color:var(--cs)}
.opt.t-danger .opt-ic{background:var(--danger-soft);color:var(--danger)}
.opt.t-warn .opt-ic{background:var(--warn-soft);color:var(--warn)}
.opt.on .opt-ic{background:var(--surface)}
.opt-tx{display:flex;flex-direction:column;gap:1px;min-width:0}
.opt-l{font-weight:600;font-size:15.5px}
.opt-s{font-size:12.5px;color:var(--muted)}
.opt-ck{margin-left:auto;width:26px;height:26px;border-radius:50%;background:var(--cs);color:#fff;display:grid;place-items:center;visibility:hidden;flex:none}
.opt-ck .ic{width:16px;height:16px;stroke-width:2.6}
.opt.on .opt-ck{visibility:visible}
.dot{width:14px;height:14px;border-radius:50%;flex:none;margin-inline:6px}
.d-green{background:#2FA35C}.d-yellow{background:#E5B321}.d-red{background:#D9463B}

.yn{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.yn button{min-height:68px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font-weight:600;font-size:18px;cursor:pointer}
.yn button.on{border-color:var(--cs);background:var(--cs-tint);color:var(--cs-ink)}
.rows{display:grid;gap:0;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px 10px 16px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row-l{font-weight:500;font-size:14.5px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:none}
.seg button{min-width:64px;min-height:44px;border:1.5px solid var(--line);border-radius:var(--r-s);background:var(--surface);font-weight:600;cursor:pointer;font-size:14px}
.seg button.on{border-color:var(--cs);background:var(--cs-tint);color:var(--cs-ink)}
.seg button.on[data-val="nein"]{border-color:var(--danger);background:var(--danger-soft);color:var(--danger)}

.field{display:flex;flex-direction:column;gap:6px}
.field>span{font-size:13px;font-weight:600}
.field input,.field textarea,.search input,select{width:100%;border:1.5px solid var(--line);border-radius:var(--r-s);background:var(--surface);padding:13px 14px;font-size:16px}
.field textarea{min-height:120px;resize:vertical}
.field input:focus,.field textarea:focus,.search input:focus,select:focus{outline:none;border-color:var(--cs);box-shadow:0 0 0 3px rgba(43,182,183,.15)}
.withic{position:relative}
.withic .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--cs);width:20px;height:20px}
.withic input{padding-left:44px}

.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.thumb{position:relative;margin:0;aspect-ratio:1;border-radius:var(--r-s);overflow:hidden;background:var(--surface-2);max-width:100%}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb-x{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(43,49,53,.7);color:#fff;display:grid;place-items:center;cursor:pointer}
.thumb-x .ic{width:14px;height:14px;stroke-width:2.4}
.shoot{position:relative;aspect-ratio:1;max-width:100%;border:1.5px dashed var(--cs-2);border-radius:var(--r-s);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--cs-ink);font-size:12.5px;font-weight:600;text-align:center;padding:6px;cursor:pointer;background:var(--cs-tint)}
.shoot .ic{color:var(--cs)}
.shoot.wide{grid-column:1/-1;aspect-ratio:auto;min-height:128px;font-size:15px}
.shoot.wide .ic{width:32px;height:32px}
.shoot:focus-within{outline:2px solid var(--cs);outline-offset:2px}

.pmeter{display:flex;align-items:center;gap:12px;font-size:13px;font-weight:600}
.pmeter-bar{flex:1;height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.pmeter-bar i{display:block;height:100%;background:var(--cs);transition:width .25s}
.slots{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);overflow:hidden}
.slot{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 14px;border-top:1px solid var(--line)}
.slot:first-child{border-top:0}
.slot.next{background:var(--cs-tint)}
.slot-n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1.5px solid var(--line);font-weight:600;font-size:13px;flex:none;color:var(--muted)}
.slot.next .slot-n{border-color:var(--cs);color:var(--cs-ink)}
.slot.has .slot-n{background:var(--cs);border-color:var(--cs);color:#fff}
.slot-n .ic{width:16px;height:16px;stroke-width:2.6}
.slot-tx{display:flex;flex-direction:column;min-width:0;flex:1}
.slot-l{font-weight:600;font-size:14px}
.slot-s{font-size:12px;color:var(--muted)}
.slot.next .slot-s{color:var(--cs-ink);font-weight:600}
.slot-img{width:44px;height:44px;border-radius:6px;object-fit:cover;flex:none}
.slot-btn{position:relative;min-width:72px;min-height:42px;border-radius:var(--r-s);display:grid;place-items:center;font-size:13px;font-weight:600;cursor:pointer;background:var(--cs);color:#fff;flex:none}
.slot.has .slot-btn{background:var(--surface);color:var(--cs-ink);border:1px solid var(--line)}
.slot-btn:focus-within{outline:2px solid var(--cs);outline-offset:2px}

.check{display:flex;gap:14px;align-items:flex-start;padding:16px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left;width:100%}
.check.on{border-color:var(--cs);background:var(--cs-tint)}
.box{width:26px;height:26px;border-radius:6px;border:1.5px solid #C9D1D5;display:grid;place-items:center;flex:none;background:var(--surface)}
.check.on .box{background:var(--cs);border-color:var(--cs);color:#fff}
.box .ic{width:16px;height:16px;stroke-width:2.8}
.check-tx{font-size:14.5px}
.check-tx b{display:block;margin-bottom:2px;font-weight:600}
.check-tx span{color:var(--muted);font-size:13px}

.sum{margin:0;border:1px solid var(--line);border-radius:var(--r-m);background:var(--surface);overflow:hidden}
.sum>div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:11px 14px;border-top:1px solid var(--line)}
.sum>div:first-child{border-top:0}
.sum dt{font-size:12px;color:var(--muted);grid-column:1}
.sum dd{margin:0;font-weight:600;font-size:14.5px;grid-column:1;overflow-wrap:anywhere}
.sum .edit{grid-column:2;grid-row:1/3;align-self:center;background:none;border:0;color:var(--cs-ink);font-size:12.5px;font-weight:600;cursor:pointer;padding:8px 0 8px 8px}
.sum .auto{background:var(--surface-2)}
.sum .auto dd{font-weight:500}
.autotag{color:var(--cs-ink)}
.sumthumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.sumthumbs img{width:48px;height:48px;border-radius:6px;object-fit:cover}

/* picker & history */
.pagehead{display:flex;flex-direction:column;gap:4px}
.pagehead h1{margin:0;font-size:24px;font-weight:600}
.search{position:relative}
.search .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--cs);width:20px;height:20px}
.search input{padding-left:44px}
.vlist{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.vitem{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);text-align:left;cursor:pointer}
.vitem:hover{border-color:var(--cs-4)}
.vitem.on{border-color:var(--cs);background:var(--cs-tint)}
.vitem-b{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1}
.vitem-t{font-weight:600;font-size:14.5px}
.vitem-t small{font-weight:500;color:var(--muted);font-size:12px;margin-left:6px}

.regbox .reg-h{margin:0 0 6px;font-weight:600;color:var(--cs-ink);font-size:12.5px;text-transform:uppercase;letter-spacing:.06em}
.regbox h4{margin:14px 0 4px;font-size:14px}
.regbox p{margin:0 0 6px}
.regbox ul{margin:0 0 6px;padding-left:18px}
.check:disabled{opacity:.5;cursor:not-allowed}

.mails{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;background:var(--surface)}
.mailrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border:0;border-top:1px solid var(--line);background:none;text-align:left;cursor:pointer}
.mailrow:first-child{border-top:0}.mailrow:hover{background:var(--cs-tint)}
.mail-ic{width:32px;height:32px;border-radius:8px;background:var(--cs-tint);color:var(--cs);display:grid;place-items:center;flex:none}.mail-ic .ic{width:17px;height:17px}
.mail-b{flex:1;min-width:0;display:flex;flex-direction:column}.mail-b b{font-size:13.5px;font-weight:600;overflow-wrap:anywhere}.mail-b small{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.mailmodal{width:min(760px,calc(100% - 32px));padding:0}
.mm-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}.mm-h h2{margin:0;font-size:18px}
.mm-meta{margin:0;padding:12px 18px;border-bottom:1px solid var(--line);background:var(--surface-2);display:grid;gap:6px;font-size:14px}
.mm-meta div{display:grid;grid-template-columns:70px 1fr;gap:10px}.mm-meta dt{color:var(--muted)}.mm-meta dd{margin:0;overflow-wrap:anywhere}
.mm-meta .linkbtn{display:inline-flex;align-items:center;gap:4px;padding:0}.mm-meta .linkbtn .ic{width:15px;height:15px}
.mm-body{padding:20px 18px 24px;background:#fff}
.tbl td small{display:block}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const REGLEMENT=[{"h": "1. Überlassung", "p": ["Der Arbeitgeber stellt den oben genannten Arbeitnehmer/in den Dienstwagen, zur dienstlichen Nutzung zur Verfügung. Die Bedingungen der Fahrzeugüberlassung werden mit diesem Vertrag abschließend geregelt."]}, {"h": "2. Nutzung", "p": ["Voraussetzung zur berechtigten Nutzung des Dienstwagens ist immer, dass der Benutzer im Besitz einer gültigen Fahrerlaubnis ist. Der Arbeitgeber hat das Recht, jederzeit beim Mitarbeiter den Besitz der Fahrerlaubnis zu überprüfen. Der Mitarbeiter hat den Entzug der Fahrerlaubnis dem Arbeitgeber unverzüglich anzuzeigen.", "Der Dienstwagen steht dem Mitarbeiter für alle dienstlich veranlassten Fahrten zur Verfügung. Die Verpflichtung der Wahl des wirtschaftlichsten Verkehrsmittels wird dadurch nicht beeinflusst. Ab der Übergabe des Dienstwagens erlischt der Anspruch des Mitarbeiters auf Vergütung von Fahrtkosten bei Nutzung eines privaten PKW.", "Der Dienstwagen kann vom Mitarbeiter in angemessenem Rahmen privat für Kurzstrecken genutzt werden. Dies gilt nicht für Urlaubsreisen."]}, {"h": "2a. Nutzung von Reserven Fahrzeuge", "p": ["Vor der Übernahme muss das Fahrzeug auf Schäden kontrolliert werden, falls Mängel / Schäden auftauchen, müssen diese unverzüglich an den jeweiligen Vorgesetzten per Fotodokumentation gemeldet werden. Ansonsten haftet der aktuelle Fahrzeugnutzer. Die Fahrt muss mittels Fahrzeugjournal dokumentiert werden. Das Fahrzeug muss im gereinigten und im vollgetankten Zustand zurückgegeben werden."]}, {"h": "3. Überlassung an Dritte", "p": ["Die Überlassung des Dienstwagens an Dritte ist außer im Falle dienstlicher Veranlassung grundsätzlich nicht gestattet. Die Nutzung durch Familienangehörige oder sonstiger, dem Haushalt des Mitarbeiters angehöriger Personen bedarf der vorherigen Zustimmung des direkten Vorgesetzten. Bei Rücknahme des Fahrzeuges muss das Fahrzeug auf Schäden / Mängel kontrolliert werden. Meldet der Fahrzeuginhaber dies nicht dem Vorgesetzten, haftet er selbst. Voraussetzung ist in jedem Fall der Besitz einer gültigen Fahrerlaubnis. Soweit der Arbeitgeber seine Zustimmung nicht erteilt hat, ist die Überlassung des Dienstwagens an Dritte nicht gestattet."]}, {"h": "4. Betriebs- und Unterhaltskosten", "p": ["Die notwendigen mit dem Betrieb des Fahrzeugs verbundenen Kosten, insbesondere die für Wartung, Reparaturen, Haupt- und Abgasuntersuchungen, Kraftstoff, Öl, trägt der Arbeitgeber. Der Mitarbeiter erhält eine entsprechende Tankkarte. Beim Tanken mit der Tankkarte ist der jeweilige Kilometerstand anzugeben (Benzinprotokoll). Da Benzinprotokoll muss bis am 5. des Folgemonats abgegeben werden. Nicht einhalten kann mit einer Busse bestraft werden. Kosten für Nachfüllöle, Scheibenreiniger und der Kauf kleinerer Ersatzteile sind auf maximal Fr. 50.00/Monat begrenzt. Die Wagenreinigung geht zu Lasten des Arbeitnehmers.", "Kraftstoffkosten für Privatfahrten, die über Fahrten zwischen Wohnung und Arbeitsstätte hinausgehen, trägt der Mitarbeiter."]}, {"h": "5. Versicherung", "p": ["Der Arbeitgeber schließt für den Dienstwagen eine Haftpflichtversicherung mit unbegrenzter Deckungssumme; Selbstbeteiligung CHF 500.00 und eine Vollkaskoversicherung mit einer Selbstbeteiligung von CHF 500.00 ab. Bei Neulenker unter 23. Jahren ist die Selbstbeteiligung von je CHF 1‘500.00."]}, {"h": "6. Reparaturen/Unfälle", "p": ["Der Mitarbeiter ist verpflichtet, für die rechtzeitige Durchführung der vom Hersteller empfohlenen oder sonst notwendig erscheinenden Maßnahmen, wie Inspektionen, Reparaturen, Ölwechsel, Reinigung usw. zu sorgen. Er ist für rechtzeitiges Auftanken und für die Kontrolle des Ölstands und des Reifendrucks verantwortlich. Er verpflichtet sich, das Fahrzeug stets schonend zu behandeln und ist für die Einhaltung der Verkehrsvorschriften und den verkehrssicheren Zustand des Dienstwagens verantwortlich. Er trägt ebenfalls die Verantwortung für das Reifenprofil. Notwendige Reparaturen hat der Mitarbeiter in Absprache mit dem Arbeitgeber in einer vom Hersteller autorisierten Vertragswerkstatt ausführen zu lassen. Der Mitarbeiter ist verpflichtet und berechtigt, Gewährleistungsansprüche bei Vertragswerkstätten des Herstellers rechtzeitig geltend zu machen."]}, {"h": "7. Ortung", "p": ["Jedes Fahrzeug ist mit einem GPS-Signal ausgestattet, und kann vom Arbeitgeber kontrolliert bzw. überwacht werden."]}, {"h": "8. Haftung", "p": ["Verschuldet der Mitarbeiter auf einer Privatfahrt einen Unfall, so hat er dem Arbeitgeber sämtliche hierdurch eintretenden Schäden zu ersetzen. Der Mitarbeiter haftet auch für sämtliche Schäden, die im Zusammenhang mit der unberechtigten Überlassung des Dienstwagens an Dritte stehen.", "Verschuldet der Mitarbeiter auf einer Dienstfahrt einen Unfall, so haftet er grundsätzlich uneingeschränkt, wenn er den Schaden infolge grober Fahrlässigkeit oder vorsätzlich verursacht hat. Anderenfalls richtet sich die Haftung des Mitarbeiters nach dem Grad des Verschuldens. Mindestens den Selbstbehalt von CHF 500.00 (Neulenker CHF 1‘500.00) der Haftpflichtversicherung sowie den Selbstbehalt von CHF 500.00 (Neulenker CHF 1‘500.00) für die Vollkaskoversicherung ist vom Arbeitnehmer zu übernehmen. Verkehrsbussen und Gebühren für nächtliches Parkieren müssen vom Arbeitnehmer in jedem Falle übernommen werden."]}, {"h": "9. Widerruf des Nutzungsrechts", "p": ["Der Arbeitgeber behält sich das Recht vor, die Zusage zur Überlassung eines Dienstwagens jederzeit aus wichtigem Grund zu widerrufen. Dies gilt insbesondere im Falle einer wesentlichen Änderung des Aufgabengebiets des Mitarbeiters, bei einer Reduzierung seiner Arbeitszeit um mehr als 25%, des Verlusts der Fahrerlaubnis, sowie während des Ruhens des Arbeitsverhältnisses von mehr als zwei Wochen (insbesondere im Fall der Freistellung des Arbeitnehmers). Macht der Arbeitgeber von dem Widerrufsrecht Gebrauch, so hat er dem Arbeitnehmer den gem. Ziffer 2 zu ermittelnden geldwerten Vorteil der Privatnutzung als zusätzliche Bruttovergütung auszubezahlen."]}, {"h": "10. Herausgabe/Ersetzungsrecht", "p": ["Der Arbeitgeber kann den Dienstwagen jederzeit ohne Einhaltung einer Frist herausverlangen oder durch einen anderen ersetzen. Der Arbeitnehmer hat im Falle der Kündigung den Dienstwagen nebst Papieren unverzüglich an den Arbeitgeber herauszugeben. Ein Zurückbehaltungsrecht kann der Arbeitnehmer in keinem Falle geltend machen."]}, {"h": "11. Sorgfalts- und Treuepflicht/Reinigung", "p": ["Der Mitarbeiter hat das Fahrzeug regelmässig (auf eigene Kosten) innen und aussen zu reinigen. Das heisst: Es muss stets einen sauberen und einen gepflegten Eindruck hinterlassen. Der Arbeitgeber behält sich vor, regelmässige unangekündigte Stichkontrollen durchzuführen. Bei Widerhandlungen kann der Arbeitgeber eine Busse aussprechen. Der Lieferwagen sowie die transportierten Maschinen und Geräte sind sorgfältig zu bedienen und zu behandeln. Der Dienstwagen wird immer mit abgeschlossenen Türen und geschlossenen Fenster verlassen.", "Anpassungen dieser Regeln werden vom Arbeitgeber schriftlich mitgeteilt – der Arbeitnehmer kann gegen diese Anpassungen innert 30 Tagen Beschwerde einreichen – falls er dies nicht tut, gelten die Anpassungen als bewilligt. Bei selbstverschuldetem Schaden (Diebstahl) so haftet er grundsätzlich uneingeschränkt, wenn er den Schaden infolge grober Fahrlässigkeit oder vorsätzlich verursacht hat. Anderenfalls richtet sich die Haftung des Mitarbeiters nach dem Grad des Verschuldens.", "Ebenfalls ist das Rauchen im Fahrzeug strengstens verboten, dies wird ebenfalls umgehend gebüsst.", "Die Bussen fallen wie folgt aus:"], "l": ["Benzinprotokoll nicht abgegeben: CHF 20.00", "Fahrzeug nicht gereinigt: CHF 50.00", "Fahrzeugjournal nicht ausgefüllt (Reservefahrzeuge): CHF 100.00", "Rauchen im Fahrzeug: CHF 200.00"]}, {"h": "12. Schlussbestimmung", "p": ["Der Vertrag ist Bestandteil des Arbeitsvertrages. Wird dieser beendet, so endet zugleich auch der Dienstwagen-Überlassungsvertrag. Die Ungültigkeit einer oder mehrerer Bestimmungen dieses Vertrages berührt die Wirksamkeit der übrigen nicht.", "Der untenstehende Arbeitnehmer ist mit dem Reglement einverstanden und bestätigt dies mit einer Unterschrift."]}];

function shrink(file){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=()=>{const img=new Image();img.onload=()=>{const max=1280;const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72));};img.onerror=()=>res(null);img.src=r.result;};
    r.onerror=()=>res(null);r.readAsDataURL(file);
  });
}

  tanken:{title:()=>t('fl_tanken'),submit:()=>t('sub_tanken')},

  uebernahme:{title:()=>t('fl_uebernahme'),submit:d=>d.utype==='rueckgabe'?t('sub_rueck'):t('sub_ueb')}

function stepsFor(){
  const d=S.data;
  if(S.flow==='tanken')return ['km','fuel','liter','chf','receipt','dept','summary'];
  const tr=isTrailer(veh());
  if(S.flow==='meldung'){
    const k=d.mtype;let mid=[];
    if(k==='schaden')mid=['ort','dmg','bilder','unfall',...(d.unfall==='ja'?['unfalldetails']:[])];
    else if(k==='fehler')mid=['flt','bilderOpt'];
    else if(k==='pneu')mid=['bilderPneu','bemerkung'];
    else if(k)mid=['bemerkung'];
    return ['mtype',...(tr?[]:['km']),...mid,'summary'];
  }
  return ['utype',...(tr?[]:['km']),'schluessel','zustand','fotos','zubehoer',...(d.utype==='rueckgabe'?[]:['reglement']),'summary'];
}

function sha256js(str){const K=[],H=[];let n=2,c=0;const isP=x=>{for(let i=2;i*i<=x;i++)if(x%i===0)return false;return true;};const fr=x=>((x-Math.floor(x))*4294967296)|0;
  while(c<64){if(isP(n)){if(c<8)H[c]=fr(Math.pow(n,1/2));K[c++]=fr(Math.pow(n,1/3));}n++;}
  const b=Array.from(new TextEncoder().encode(str));const l=b.length*8;b.push(0x80);while(b.length%64!==56)b.push(0);for(let i=7;i>=0;i--)b.push(i>3?0:(l>>>(i*8))&255);
  const r=(x,y)=>(x>>>y)|(x<<(32-y));
  for(let o=0;o<b.length;o+=64){const w=[];for(let i=0;i<16;i++)w[i]=(b[o+i*4]<<24)|(b[o+i*4+1]<<16)|(b[o+i*4+2]<<8)|b[o+i*4+3];
    for(let i=16;i<64;i++){const s0=r(w[i-15],7)^r(w[i-15],18)^(w[i-15]>>>3),s1=r(w[i-2],17)^r(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0;}
    let [a,bb,cc,d,e,f,g,h]=H;
    for(let i=0;i<64;i++){const S1=r(e,6)^r(e,11)^r(e,25),ch=(e&f)^(~e&g),t1=(h+S1+ch+K[i]+w[i])|0,S0=r(a,2)^r(a,13)^r(a,22),mj=(a&bb)^(a&cc)^(bb&cc),t2=(S0+mj)|0;h=g;g=f;f=e;e=(d+t1)|0;d=cc;cc=bb;bb=a;a=(t1+t2)|0;}
    H[0]=(H[0]+a)|0;H[1]=(H[1]+bb)|0;H[2]=(H[2]+cc)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;}
  return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');}
async function pnHash(s){const v='cs-fz:'+s;if(window.crypto&&crypto.subtle){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}catch(e){}}return sha256js(v);}

    }else{
      const missing=ZUB.filter(k=>d['z_'+k]==='nein');
      Object.assign(rec,{sub:d.utype,key:null,nPhotos:SLOTS.flatMap(s=>P(s.k)).length,missing,notClean:d.zustand==='nein',photos:[...SLOTS.flatMap(s=>P(s.k)),...P('zustand')],note:(d.zustandTxt||'').trim(),zub:Object.fromEntries(ZUB.map(k=>[k,d['z_'+k]])),reglement:d.utype==='rueckgabe'?null:!!d.reglement,keyPhotos:P('keyphoto').slice(),slotPhotos:Object.fromEntries([...SLOTS.map(s=>[s.k,P(s.k).slice()]),['zustand',P('zustand').slice()]].filter(x=>x[1].length))});
      notice=missing.length||rec.notClean?{cls:'hoch',key:'nUebIssue'}:{cls:'normal',key:'nUebOk'};
    }
    rec.notice=notice;
    sendMails(rec);
    S.history.unshift(rec);if(km!=null)v.lastKm=Math.max(v.lastKm||0,km);
    S.last=rec;S.submitting=false;S.flow=null;S.screen='done';render();top0();
  },900);
}

function vTable(list,om){
  return `<table class="tbl"><thead><tr><th class="r">Nr.</th><th>Fahrzeug</th><th>Kennzeichen</th><th>Typ / Antrieb</th><th class="r">KM-Stand</th><th>Zugeteilt</th><th class="r">Offene Meldungen</th><th>Status</th></tr></thead><tbody>
  ${list.map(v=>{const a=assignment(v.id);const n=om.filter(h=>h.veh===v.id).length;return `<tr class="click" data-act="vopen" data-id="${v.id}" tabindex="0"><td class="r num">${v.nr}</td><td><b>${esc(v.model)}</b></td><td>${plate(v)}</td><td>${isTrailer(v)?'Anhänger':'Fahrzeug'}<small>${isTrailer(v)?'–':DRIVE_L[v.fuel||'']}</small></td><td class="r num">${v.lastKm!=null?fmtKm(v.lastKm):'<span class="muted">–</span>'}</td><td>${a?esc(a.who)+`<small>${a.sub==='definitiv'?'definitiv':'temporär'}</small>`:'<span class="muted">–</span>'}</td><td class="r">${n?`<span class="cnt">${n}</span>`:'<span class="muted">0</span>'}</td><td>${vstPill(v.status)}</td></tr>`;}).join('')||'<tr><td colspan="8" class="muted">Kein Fahrzeug gefunden.</td></tr>'}
  </tbody></table>`;
}
function aFahrzeug(){
  const v=veh(S.aVeh);if(!v){S.aView='fahrzeuge';return aFahrzeuge();}
  const a=assignment(v.id),om=openM().filter(h=>h.veh===v.id);
  const cost=S.history.filter(h=>h.kind==='tanken'&&h.veh===v.id&&h.at>=Date.now()-30*864e5).reduce((s,h)=>s+h.chf,0);
  const hist=S.history.filter(h=>h.veh===v.id).sort((x,y)=>y.at-x.at);
  return `<button class="linkbtn backlink" data-act="aview" data-v="fahrzeuge">${ic('back')}Alle Fahrzeuge</button>`+aHead(`${esc(v.model)} <span class="h-sub">Nr. ${v.nr}</span>`,`${plate(v)} ${vstPill(v.status)}`)+
  `<div class="kpis">${kpi('Letzter KM-Stand',v.lastKm!=null?fmtKm(v.lastKm)+' km':'–')}${kpi('Zugeteilt an',a?esc(a.who):'Niemand',a?(a.sub==='definitiv'?'Definitiv seit ':'Temporär seit ')+a.at.toLocaleDateString('de-CH'):'')}${kpi('Tankkosten 30 Tage',chf(cost),isTrailer(v)?'':`<button class="linkbtn" data-act="vtank" data-id="${v.id}">Alle Tankvorgänge ansehen</button>`)}${kpi('Offene Meldungen',om.length,'',om.length?'danger':'')}</div>
  <div class="acols"><section class="apanel pad"><h2 class="h3">Stammdaten</h2>
    <form class="form" data-form="veh" novalidate>
      <label class="field" for="e-model"><span>Bezeichnung</span><input id="e-model" name="model" value="${esc(v.model)}" required></label>
      <div class="frow"><label class="field" for="e-nr"><span>Nr.</span><input id="e-nr" name="nr" value="${esc(v.nr)}" inputmode="numeric" required></label><label class="field" for="e-plate"><span>Kennzeichen</span><input id="e-plate" name="plate" value="${esc(v.plate)}" required></label></div>
      <div class="frow"><label class="field" for="e-kind"><span>Typ</span><select id="e-kind" name="kind"><option value="auto" ${!isTrailer(v)?'selected':''}>Fahrzeug</option><option value="anhaenger" ${isTrailer(v)?'selected':''}>Anhänger</option></select></label>
      <label class="field" for="e-fuel"><span>Antrieb</span><select id="e-fuel" name="fuel">${Object.entries(DRIVE_L).map(([k,l])=>`<option value="${k}" ${(v.fuel||'')===k?'selected':''}>${l}</option>`).join('')}</select></label></div>
      <label class="field" for="e-status"><span>Status</span><select id="e-status" name="status">${Object.entries(VST_L).map(([k,l])=>`<option value="${k}" ${v.status===k?'selected':''}>${l}</option>`).join('')}</select></label>
      <p class="err" id="ferr" role="alert" hidden></p>
      <button class="primary" type="submit">Änderungen speichern</button>
    </form></section>
  <section class="apanel"><div class="apanel-h"><h2>Fahrzeughistorie</h2><span class="muted">${hist.length} Vorgänge</span></div>${hist.length?`<ul class="evs flat">${hist.map(h=>evItem(h,false).replace('<div class="ev-h">',`<div class="ev-h">${h.kind==='meldung'?stPill(h.status):''}`)).join('')}</ul>`:'<p class="empty pad">Noch keine Vorgänge für dieses Fahrzeug.</p>'}</section></div>`;
}

function aTanken(){
  const now=new Date();const tm=S.tm==null?0:S.tm,tv=S.tveh||'all';
  const mRange=i=>[new Date(now.getFullYear(),now.getMonth()-i,1),new Date(now.getFullYear(),now.getMonth()-i+1,1)];
  const mName=d=>d.toLocaleDateString('de-CH',{month:'long',year:'numeric'});
  const tanks=S.history.filter(h=>h.kind==='tanken');
  let base=tanks;if(tm!=='all'){const [m0,m1]=mRange(tm);base=base.filter(h=>h.at>=m0&&h.at<m1);}
  const inMonth=base;if(tv!=='all')base=base.filter(h=>h.veh===tv);
  let list=base.slice().sort((a,b)=>b.at-a.at);const all=list;if(S.tdept!=='all')list=list.filter(h=>h.dept===S.tdept);
  const tot=list.reduce((a,h)=>a+h.chf,0),L=list.filter(h=>h.fuel!=='strom').reduce((a,h)=>a+h.liter,0),K=list.filter(h=>h.fuel==='strom').reduce((a,h)=>a+h.liter,0);
  const byDept=DEPTS.map(d=>{const x=all.filter(h=>h.dept===d);return {d,n:x.length,c:x.reduce((a,h)=>a+h.chf,0)};});const allC=all.reduce((a,h)=>a+h.chf,0)||1;
  const byVeh=VEH.map(v=>{const x=inMonth.filter(h=>h.veh===v.id);return {v,n:x.length,c:x.reduce((a,h)=>a+h.chf,0)};}).filter(x=>x.n).sort((a,b)=>b.c-a.c);const vehC=byVeh.reduce((a,x)=>a+x.c,0)||1;
  const vehOpts=VEH.filter(v=>!isTrailer(v));const active=tm!==0||tv!=='all'||S.tdept!=='all';
  const period=tm==='all'?'alle Monate':mName(mRange(tm)[0]);const vsel=tv!=='all'?veh(tv):null;
  return aHead('Tankvorgänge','Tank- und Ladevorgänge mit Quittung, zur Kostenverteilung auf Abteilungen und Fahrzeuge.')+
  `<div class="toolbar filters"><label class="field inline" for="t-month"><span>Monat</span><select id="t-month" data-adm="tm"><option value="all" ${tm==='all'?'selected':''}>Alle Monate</option>${Array.from({length:12},(_,i)=>`<option value="${i}" ${tm===i?'selected':''}>${mName(mRange(i)[0])}</option>`).join('')}</select></label>
  <label class="field inline" for="t-veh"><span>Fahrzeug</span><select id="t-veh" data-adm="tveh"><option value="all">Alle Fahrzeuge</option>${vehOpts.map(v=>`<option value="${v.id}" ${tv===v.id?'selected':''}>Nr. ${v.nr} · ${esc(v.model)} · ${v.plate}</option>`).join('')}</select></label>
  ${active?`<button class="linkbtn" data-act="treset">Filter zurücksetzen</button>`:''}</div>
  <p class="hint">${list.length} Vorgänge · ${period}${vsel?' · '+esc(vsel.model)+' '+vsel.plate:''}${S.tdept!=='all'?' · '+deL('dept_'+S.tdept):''}</p>
  <div class="kpis">${kpi('Total',chf(tot),`${list.length} Vorgänge`)}${kpi('Treibstoff',L.toLocaleString('de-CH',{maximumFractionDigits:1})+' L',L?`Ø ${chf(list.filter(h=>h.fuel!=='strom').reduce((a,h)=>a+h.chf,0)/L)} pro Liter`:'')}${kpi('Strom',K.toLocaleString('de-CH',{maximumFractionDigits:1})+' kWh',K?`Ø ${chf(list.filter(h=>h.fuel==='strom').reduce((a,h)=>a+h.chf,0)/K)} pro kWh`:'')}</div>
  <div class="acols even">
  <section class="apanel"><div class="apanel-h"><h2>Nach Abteilung</h2></div><div class="tbl-wrap"><table class="tbl sm"><thead><tr><th>Abteilung</th><th class="r">Vorgänge</th><th class="r">Kosten</th><th>Anteil</th></tr></thead><tbody>${byDept.map(x=>`<tr class="click" data-act="afilter" data-k="tdept" data-f="${S.tdept===x.d?'all':x.d}" tabindex="0"><td><b>${deL('dept_'+x.d)}</b>${S.tdept===x.d?' <span class="st st-bearbeitung">Filter</span>':''}</td><td class="r num">${x.n}</td><td class="r num">${chf(x.c)}</td><td><span class="bar"><i style="width:${x.c/allC*100}%"></i></span><span class="num muted"> ${Math.round(x.c/allC*100)}%</span></td></tr>`).join('')}</tbody></table></div></section>
  <section class="apanel"><div class="apanel-h"><h2>Nach Fahrzeug</h2><span class="muted">${period}</span></div><div class="tbl-wrap"><table class="tbl sm"><thead><tr><th>Fahrzeug</th><th class="r">Vorgänge</th><th class="r">Kosten</th></tr></thead><tbody>${byVeh.slice(0,8).map(x=>`<tr class="click" data-act="tvehf" data-id="${tv===x.v.id?'all':x.v.id}" tabindex="0"><td><span class="vcell">${plate(x.v)}<b>${esc(x.v.model)}</b></span>${tv===x.v.id?' <span class="st st-bearbeitung">Filter</span>':''}</td><td class="r num">${x.n}</td><td class="r num">${chf(x.c)}</td></tr>`).join('')||'<tr><td colspan="3" class="muted">Keine Tankvorgänge.</td></tr>'}</tbody></table></div></section>
  </div>
  <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Datum</th><th>Fahrzeug</th><th>Mitarbeiter</th><th>Abteilung</th><th>Treibstoff</th><th class="r">Menge</th><th class="r">Betrag</th><th class="r">Preis / Einheit</th><th>Dokumente</th></tr></thead><tbody>
  ${list.map(h=>{const v=veh(h.veh),e=h.fuel==='strom';return `<tr><td>${dS(h.at)}</td><td>${vLabel(v)}</td><td>${esc(h.who)}</td><td>${h.dept?deL('dept_'+h.dept):'–'}</td><td>${deL('fuel_'+h.fuel)}</td><td class="r num">${h.liter.toFixed(1)} ${e?'kWh':'L'}</td><td class="r num">${chf(h.chf)}</td><td class="r num">${(h.chf/h.liter).toFixed(2)}</td><td class="docs"><button class="linkbtn" data-act="pdf" data-id="${h.id}">PDF</button>${h.mails&&h.mails.length?` · <button class="linkbtn" data-act="mailprev" data-id="${h.id}" data-i="0">Mail</button>`:''}${h.photos&&h.photos.length?` · <button class="linkbtn" data-act="img" data-id="${h.id}" data-i="0">Quittung</button>`:''}</td></tr>`;}).join('')||'<tr><td colspan="9" class="muted">Keine Tankvorgänge für diese Auswahl.</td></tr>'}
  </tbody></table></div>`;
}
function aUeb(){
  const cur=VEH.map(v=>({v,a:assignment(v.id)})).filter(x=>x.a).sort((x,y)=>+x.v.nr-+y.v.nr);
  const free=VEH.filter(v=>!isTrailer(v)&&!assignment(v.id));
  const hist=S.history.filter(h=>h.kind==='uebernahme').sort((a,b)=>b.at-a.at).slice(0,15);
  const issues=a=>[...(a.missing||[]).map(k=>'fehlt: '+deL('zub_'+k)),a.notClean?'nicht sauber':''].filter(Boolean);
  return aHead('Übernahmen','Wer fährt welches Fahrzeug – aus den Übernahmen und Abgaben der Mitarbeitenden.')+
  `<section class="apanel"><div class="apanel-h"><h2>Aktuelle Zuteilung</h2><span class="muted">${cur.length} Fahrzeuge</span></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Fahrzeug</th><th>Mitarbeiter</th><th>Art</th><th>Seit</th><th>Hinweise bei Übernahme</th></tr></thead><tbody>
  ${cur.map(({v,a})=>`<tr class="click" data-act="vopen" data-id="${v.id}" tabindex="0"><td>${vLabel(v)}</td><td>${esc(a.who)}</td><td>${a.sub==='definitiv'?'<span class="st st-ok">Definitiv</span>':'<span class="st st-bearbeitung">Temporär</span>'}</td><td>${a.at.toLocaleDateString('de-CH')}<small>${rel(a.at)}</small></td><td>${issues(a).length?`<span class="warn-t">${issues(a).join(', ')}</span>`:'<span class="muted">Keine</span>'}</td></tr>`).join('')}
  </tbody></table></div></section>
  <section class="apanel pad"><h2 class="h3">Nicht zugeteilt (${free.length})</h2><div class="freelist">${free.map(v=>`<button class="freechip" data-act="vopen" data-id="${v.id}">${plate(v)} ${esc(v.model)}</button>`).join('')}</div></section>
  <section class="apanel"><div class="apanel-h"><h2>Letzte Übernahmen und Abgaben</h2></div><ul class="evs flat">${hist.map(h=>evItem(h,true)).join('')}</ul></section>`;
}

function uTable(){
  const since=Date.now()-30*864e5,q=(S.uq||'').trim().toLowerCase(),f=S.uf||'all';
  const car=n=>{const x=VEH.find(v=>{const a=assignment(v.id);return a&&a.who===n;});return x?`${plate(x)} <small>${esc(x.model)}</small>`:'<span class="muted">–</span>';};
  const list=USERS.filter(u=>(f==='all'||(f==='admin'?u.role==='admin':u.dept===(f==='admin_d'?'admin':f)))&&(!q||u.name.toLowerCase().includes(q)));
  return `<table class="tbl"><thead><tr><th>Name</th><th>Abteilung</th><th>Konto</th><th>Aktuelles Fahrzeug</th><th class="r">Vorgänge 30 Tage</th></tr></thead><tbody>
  ${list.map(u=>`<tr><td><span class="ucell"><i>${u.initials}</i><b>${esc(u.name)}</b>${u.demo?' <span class="st vst-ausser">Demo</span>':''}</span></td><td>${u.dept?deL('dept_'+u.dept):'<span class="muted">–</span>'}</td><td><select class="mini" data-adm="urole" data-id="${u.id}" aria-label="Konto von ${esc(u.name)}"><option value="ma" ${u.role==='ma'?'selected':''}>Mitarbeiter-App</option><option value="admin" ${u.role==='admin'?'selected':''}>Verwaltung</option></select></td><td>${car(u.name)}</td><td class="r num">${S.history.filter(h=>h.who===u.name&&h.at>=since).length}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">Keine Person gefunden.</td></tr>'}
  </tbody></table>`;
}
function aUsers(){
  const n=k=>k==='all'?USERS.length:k==='admin'?USERS.filter(u=>u.role==='admin').length:USERS.filter(u=>u.dept===(k==='admin_d'?'admin':k)).length;
  return aHead('Mitarbeitende',`${USERS.filter(u=>u.role==='ma').length} Personen aus Springer, Spezialreinigung, Hauswartung und Administration – übernommen aus der App Materialbestellung.`,`<button class="primary sm" data-act="modal" data-m="adduser">${ic('plus')}Person hinzufügen</button>`)+
  `<div class="toolbar"><div class="search">${ic('search')}<input id="uq" type="search" placeholder="Name suchen" value="${esc(S.uq||'')}" aria-label="Name suchen"></div>
  <div class="chips">${[['all','Alle'],['spring','Springerteam'],['spez','Spezialreinigung'],['haus','Hauswartung'],['admin_d','Administration'],['admin','Verwaltungszugang']].map(([k,l])=>`<button class="chip ${(S.uf||'all')===k?'on':''}" data-act="afilter" data-k="uf" data-f="${k}" aria-pressed="${(S.uf||'all')===k}">${l} <span class="chip-n">${n(k)}</span></button>`).join('')}</div></div>
  <div class="tbl-wrap" id="utbl">${uTable()}</div><p class="hint">In der finalen App kommt diese Liste direkt aus derselben Mitarbeiter-Datenbank wie die Materialbestellung; neue Personen melden sich mit ihrem Firmenkonto an.</p>`;
}
function aSettings(){
  const EV=[['tanken','Tankvorgang'],['schaden','Schaden'],['service','Service nötig'],['fehler','Fehlermeldung am Fahrzeug'],['pneu','Pneuwechsel nötig'],['bremsen','Bremsen fällig']];
  return aHead('Benachrichtigungen','Welche E-Mails die App bei jedem Vorgang automatisch verschickt – mit PDF auf Logopapier im Anhang.')+
  `<div class="${MAIL_ENDPOINT?'notice n-normal':'warnbox'}">${MAIL_ENDPOINT?'Versand über Resend (Vercel). Absender: fahrzeuge@clean-service.ch – Antworten der Carrosserie und Garage kommen dort an. Der Status jeder Mail ist beim jeweiligen Vorgang sichtbar.':'Der E-Mail-Versand ist vorbereitet, aber noch nicht verbunden.'}</div>
  <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Ereignis</th><th>Intern</th><th>Extern</th><th>Vorschau</th></tr></thead><tbody>
  ${EV.map(([k,l])=>{const R=k==='tanken'?MAIL_RULES.tanken:MAIL_RULES[k];const cell=kind=>{const x=R.filter(r=>r[1]===kind).map(r=>MAIL_TO[r[0]]);return x.length?x.map(t=>`<b>${eh(t.label)}</b><small>${eh(t.addr)}</small>`).join(''):'<span class="muted">–</span>';};
    return `<tr><td><b>${l}</b>${k!=='tanken'&&MTYPES[k]?`<small>Priorität ${deL('prio_'+MTYPES[k].prio)}${k==='schaden'?' · mit Drittperson: sehr hoch':''}</small>`:''}</td><td>${cell('intern')}</td><td>${cell('extern')}</td><td class="docs">${R.map((r,i)=>`<button class="linkbtn" data-act="mailsample" data-k="${k}" data-i="${i}">${r[1]==='extern'?'Extern':'Intern'}</button>`).join(' · ')}</td></tr>`;}).join('')}
  </tbody></table></div>
  <p class="hint">Übernahmen und Abgaben lösen keine E-Mail aus. Externe Mails enthalten keine Angaben zur Drittperson und keine internen Bearbeitungsnotizen.</p>`;
}
function aKontrolle(){
  return aHead('Fahrzeugkontrolle','Nur für die Verwaltung sichtbar.')+`<div class="lockcard"><p>Die interne Quartalskontrolle bleibt ein separates Modul und ist für Mitarbeitende nicht sichtbar.</p><p>Sie greift auf denselben Fahrzeugstamm zu, so dass Kontrollen, Mängel und die Meldungen aus der Mitarbeiter-App in derselben Fahrzeughistorie zusammenlaufen.</p><button class="secondary" disabled>Kontrolle öffnen (Verknüpfung folgt)</button></div>`;
}

function aModal(){
  const m=S.modal;
  if(m.t==='mail')return mailModal();
  if(m.t==='img'){const h=S.history.find(x=>x.id===m.id);return `<div class="scrim top" data-act="mclosemodal"></div><div class="lightbox" role="dialog" aria-modal="true" aria-label="Foto"><img src="${m.src||h.photos[m.i]}" alt="Foto"><button class="iconbtn" data-act="mclosemodal" aria-label="Schliessen">${ic('x')}</button></div>`;}
  const body=m.t==='addveh'?`<h2>Fahrzeug hinzufügen</h2><form class="form" data-form="addveh" novalidate>
      <label class="field" for="n-model"><span>Bezeichnung</span><input id="n-model" name="model" placeholder="z. B. Renault Trafic" required></label>
      <div class="frow"><label class="field" for="n-nr"><span>Nr.</span><input id="n-nr" name="nr" inputmode="numeric" placeholder="72" required></label><label class="field" for="n-plate"><span>Kennzeichen</span><input id="n-plate" name="plate" placeholder="ZH 123 456" required></label></div>
      <div class="frow"><label class="field" for="n-kind"><span>Typ</span><select id="n-kind" name="kind"><option value="auto">Fahrzeug</option><option value="anhaenger">Anhänger</option></select></label><label class="field" for="n-fuel"><span>Antrieb</span><select id="n-fuel" name="fuel">${Object.entries(DRIVE_L).map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select></label></div>
      <p class="err" id="ferr" role="alert" hidden></p><div class="frow"><button type="button" class="secondary" data-act="mclosemodal">Abbrechen</button><button class="primary" type="submit">Hinzufügen</button></div></form>`
  :`<h2>Person hinzufügen</h2><form class="form" data-form="adduser" novalidate>
      <label class="field" for="n-name"><span>Vor- und Nachname</span><input id="n-name" name="name" required></label>
      <div class="frow"><label class="field" for="n-dept"><span>Abteilung</span><select id="n-dept" name="dept">${DEPTS.map(d=>`<option value="${d}">${deL('dept_'+d)}</option>`).join('')}</select></label><label class="field" for="n-role"><span>Konto</span><select id="n-role" name="role"><option value="ma">Mitarbeiter-App</option><option value="admin">Verwaltung</option></select></label></div>
      <p class="err" id="ferr" role="alert" hidden></p><div class="frow"><button type="button" class="secondary" data-act="mclosemodal">Abbrechen</button><button class="primary" type="submit">Hinzufügen</button></div></form>`;
  return `<div class="scrim top" data-act="mclosemodal"></div><div class="modal" role="dialog" aria-modal="true">${body}</div>`;
}

function renderAdmin(){
  const V={dash:aDash,meldungen:aMeldungen,fahrzeuge:aFahrzeuge,fahrzeug:aFahrzeug,tanken:aTanken,uebernahmen:aUeb,users:aUsers,settings:aSettings};
  return aShell((V[S.aView]||aDash)());
}
function toast(msg){S.toast=msg;render();clearTimeout(toast._t);toast._t=setTimeout(()=>{S.toast=null;const el=document.querySelector('.toast');if(el)el.remove();},2200);}
function mlog(h,text){(h.log=h.log||[]).push({at:new Date(),who:S.user.name,text});}
const curM=()=>S.history.find(x=>x.id===S.aSel);

Object.assign(A,{
  aview:b=>{S.aView=b.dataset.v;S.aSel=null;render();top0();},
  afilter:b=>{S[b.dataset.k]=b.dataset.f;render();},
  msel:b=>{S.aSel=b.dataset.id;render();},
  mclose:()=>{S.aSel=null;render();},
  mstatus:b=>{const h=curM();if(h.status===b.dataset.st)return;h.status=b.dataset.st;mlog(h,'Status: '+ST_L[h.status]);toast('Status geändert: '+ST_L[h.status]);},
  mnote:()=>{const el=document.getElementById('m-note');const x=(el.value||'').trim();if(!x){el.focus();return;}mlog(curM(),'Notiz: '+x);toast('Notiz hinzugefügt');},
  vshop:b=>{const v=veh(b.dataset.id);v.status='werkstatt';mlog(curM(),'Fahrzeug auf «In Werkstatt» gesetzt');toast('Fahrzeug steht jetzt auf «In Werkstatt»');},
  vactive:b=>{const v=veh(b.dataset.id);v.status='aktiv';mlog(curM(),'Fahrzeug wieder auf «Aktiv» gesetzt');toast('Fahrzeug ist wieder aktiv');},
  vopen:b=>{S.aVeh=b.dataset.id;S.aView='fahrzeug';render();top0();},
  modal:b=>{S.modal={t:b.dataset.m};render();const f=document.querySelector('.modal input');if(f)f.focus();},

const PDF_W=595.3,PDF_H=841.9,PDF_L=70.9,PDF_R=510,PDF_TOP=700,PDF_BOTTOM=112;
const C_INK=[0.17,0.19,0.21],C_MUTED=[0.42,0.45,0.47],C_CS=[0.09,0.50,0.50],C_LINE=[0.86,0.89,0.9];

const deDT=d=>d.toLocaleDateString('de-CH',{day:'2-digit',month:'2-digit',year:'numeric'})+', '+d.toLocaleTimeString('de-CH',{hour:'2-digit',minute:'2-digit'})+' Uhr';

async function buildPdf(rec,opt){opt=opt||{};const ext=!!opt.external;
  const {PDFDocument,StandardFonts,rgb}=PDFLib;
  const doc=await PDFDocument.create();
  const v=veh(rec.veh);
  const title=rec.kind==='tanken'?(rec.fuel==='strom'?'Ladevorgang':'Tankvorgang'):rec.kind==='meldung'?'Fahrzeugmeldung – '+DE('m_'+rec.sub):(rec.sub==='rueckgabe'?'Abgabeprotokoll':'Übernahmeprotokoll');
  doc.setTitle(`${title} ${rec.id}`);doc.setAuthor('Clean Service Scaramuzzo AG');doc.setCreator('Fahrzeug-App');doc.setProducer('Fahrzeug-App');doc.setCreationDate(new Date());
  const [bg]=await doc.embedPdf(b64u8(LETTERHEAD));
  const F=await doc.embedFont(StandardFonts.Helvetica),FB=await doc.embedFont(StandardFonts.HelveticaBold);
  const col=a=>rgb(a[0],a[1],a[2]);
  const okCh=new Map();
  const safe=s=>Array.from(String(s??'')).map(ch=>{if(!okCh.has(ch)){try{F.encodeText(ch);okCh.set(ch,true);}catch(e){okCh.set(ch,false);}}return ch==='\n'?ch:okCh.get(ch)?ch:(ch==='≈'?'ca.':'?');}).join('');
  let page,y;const pages=[];
  const newPage=()=>{page=doc.addPage([PDF_W,PDF_H]);page.drawPage(bg,{x:0,y:0,width:PDF_W,height:PDF_H});pages.push(page);y=PDF_TOP;};
  const need=h=>{if(y-h<PDF_BOTTOM)newPage();};
  const wrap=(text,font,size,width)=>{const out=[];String(safe(text)).split('\n').forEach(par=>{let line='';par.split(/\s+/).forEach(w=>{const tl=line?line+' '+w:w;if(font.widthOfTextAtSize(tl,size)<=width)line=tl;else{if(line)out.push(line);while(font.widthOfTextAtSize(w,size)>width){let i=w.length;while(i>1&&font.widthOfTextAtSize(w.slice(0,i),size)>width)i--;out.push(w.slice(0,i));w=w.slice(i);}line=w;}});out.push(line);});return out;};
  const text=(s,x,yy,font,size,c)=>page.drawText(safe(s),{x,y:yy,font,size,color:col(c||C_INK)});
  const section=(h,min)=>{need(min||40);y-=14;text(h.toUpperCase(),PDF_L,y,FB,9,C_CS);y-=6;page.drawLine({start:{x:PDF_L,y},end:{x:PDF_R,y},thickness:.6,color:col(C_LINE)});y-=14;};
  const kv=(label,value)=>{const lines=wrap(value==null||value===''?'–':value,F,10,PDF_R-PDF_L-150);const ll=wrap(label,F,9,140);const n=Math.max(lines.length,ll.length);need(n*13+4);ll.forEach((l,i)=>text(l,PDF_L,y-i*13,F,9,C_MUTED));lines.forEach((l,i)=>text(l,PDF_L+150,y-i*13,F,10));y-=n*13+5;};
  const para=(s,size=10,c=C_INK,font=F)=>{wrap(s,font,size,PDF_R-PDF_L).forEach(l=>{need(size+4);text(l,PDF_L,y,font,size,c);y-=size+4;});};
  const photos=async list=>{
    const items=list.filter(p=>p&&p.src);if(!items.length)return;
    const gap=10,w=(PDF_R-PDF_L-gap*2)/3;
    for(let i=0;i<items.length;i+=3){
      const row=items.slice(i,i+3);const imgs=[];
      for(const p of row){try{const b=b64u8(p.src.split(',')[1]);imgs.push(p.src.startsWith('data:image/png')?await doc.embedPng(b):await doc.embedJpg(b));}catch(e){imgs.push(null);}}
      const hs=imgs.map(im=>im?Math.min(w*im.height/im.width,w*1.1):w*.75);const rh=Math.max(...hs)+(row.some(p=>p.label)?16:4);
      need(rh+6);
      row.forEach((p,j)=>{const x=PDF_L+j*(w+gap),im=imgs[j],h=hs[j];if(im){const ww=Math.min(w,h*im.width/im.height);page.drawImage(im,{x,y:y-h,width:ww,height:h});}if(p.label)text(p.label,x,y-h-11,F,8.5,C_MUTED);});
      y-=rh+6;
    }
  };

  newPage();
  text('Effretikon, '+deDate(new Date()),PDF_L,y,F,10);y-=40;
  const tl=wrap(title,FB,17,PDF_R-PDF_L);tl.forEach(l=>{text(l,PDF_L,y,FB,17);y-=22;});
  text(`Vorgang ${rec.id} · erfasst am ${deDT(rec.at)}`,PDF_L,y,F,9.5,C_MUTED);y-=10;

  section('Fahrzeug');
  kv('Fahrzeug',`${v.model} (Nr. ${v.nr})`);kv('Kennzeichen',v.plate);
  if(rec.km!=null)kv('Kilometerstand',fmtKm(rec.km)+' km');

  if(rec.kind==='tanken'){
    const e=rec.fuel==='strom',u=e?'kWh':'Liter';
    section(e?'Ladevorgang':'Tankvorgang');
    kv('Erfasst von',rec.who);kv('Abteilung',rec.dept?DE('dept_'+rec.dept):null);kv('Zeitpunkt',deDT(rec.at));
    kv(e?'Energie':'Treibstoff',DE('fuel_'+rec.fuel));kv('Menge',`${rec.liter.toFixed(1)} ${u}`);kv('Betrag',chf(rec.chf));kv('Preis pro '+(e?'kWh':'Liter'),chf(rec.chf/rec.liter));
    if(rec.photos&&rec.photos.length){section('Quittung',170);await photos(rec.photos.map(s=>({src:s})));}
  }else if(rec.kind==='meldung'){
    section('Meldung');
    kv('Art der Meldung',DE('m_'+rec.sub));kv('Priorität',rec.prio?DE('prio_'+rec.prio):null);kv('Gemeldet von',rec.who);kv('Zeitpunkt',deDT(rec.at));
    if(rec.gps){kv('Ortsstempel',`${rec.gps.addr?rec.gps.addr+'\n':''}${rec.gps.lat.toFixed(5)}, ${rec.gps.lon.toFixed(5)} (Genauigkeit ca. ${rec.gps.acc} m)\n${deDT(new Date(rec.gps.at))}`);kv('Karte',`https://www.google.com/maps?q=${rec.gps.lat.toFixed(5)},${rec.gps.lon.toFixed(5)}`);}
    else if(rec.ort)kv('Ort',rec.ort);
    if(rec.dmg){kv('Schaden',(rec.dmg.types||[]).filter(k=>k!=='andere').map(k=>DE('d_'+k)).concat((rec.dmg.types||[]).includes('andere')?['Anderes']:[]).join(', '));kv('Stelle am Fahrzeug',(rec.dmg.where||[]).map(k=>DE('p_'+k)).join(', '));if(rec.dmg.text)kv('Beschreibung',rec.dmg.text);}
    else if(rec.flt){kv('Anzeige',(rec.flt.types||[]).filter(k=>k!=='andere').map(k=>DE('f_'+k)).concat((rec.flt.types||[]).includes('andere')?['Andere Meldung']:[]).join(', '));if(rec.flt.text)kv('Beschreibung',rec.flt.text);}
    else kv(rec.sub==='fehler'?'Anzeige':rec.sub==='schaden'?'Beschreibung':'Bemerkung',rec.note||'Ohne Bemerkung');
    if(rec.sub==='schaden')kv('Unfall mit Drittperson',rec.unfall?'Ja':'Nein');
    if(rec.third&&!ext){section('Angaben zur Drittperson');kv('Name',rec.third.name);kv('Telefon',rec.third.tel);kv('Kennzeichen',rec.third.kz);kv('Polizei vor Ort',rec.third.pol==='ja'?'Ja':'Nein');kv('Unfallprotokoll',rec.third.prot==='ja'?('Ausgefüllt'+(rec.third.file?` – ${rec.third.file.type==='application/pdf'?'im Anhang':'siehe unten'} (${rec.third.file.name})`:'')):'Nicht ausgefüllt');}
    if(rec.photos&&rec.photos.length){section('Fotos',170);await photos(rec.photos.map(s=>({src:s})));}
    if(!ext&&rec.third&&rec.third.file&&rec.third.file.type.startsWith('image')){section('Unfallprotokoll',170);await photos([{src:rec.third.file.data,label:rec.third.file.name}]);}
    if(!ext){section('Bearbeitung');
    kv('Status',ST_L[rec.status]);kv('Zuständig',rec.assignee||'Noch niemand');
    (rec.log||[]).forEach(l=>kv(deDT(l.at),`${l.text} (${l.who})`));}
  }else{
    section('Vorgang');
    kv('Art',DE('u_'+rec.sub));kv('Mitarbeiter',rec.who);kv('Zeitpunkt',deDT(rec.at));if(rec.key)kv('Schlüssel',DE('key_'+rec.key));
    const ks=(rec.keyPhotos||[]).map(src=>({src,label:'Schlüssel mit Anhänger'}));
    if(ks.length){section('Schlüssel',170);await photos(ks);}
    section('Zustand und Zubehör');
    kv('Sauber und ordentlich',rec.notClean?'Nein':'Ja');if(rec.notClean&&rec.note)kv('Bemerkung',rec.note);
    ZUB.forEach(k=>{const val=rec.zub?rec.zub[k]:(rec.missing||[]).includes(k)?'nein':'ja';kv(zubL(k,rec.sub,DE),val==='nein'?(k==='abgeschlossen'?'Nein':'Nein – fehlt'):'Ja');});
    if(rec.sub!=='rueckgabe')kv('Dienstwagenreglement',rec.reglement===false?'Nicht bestätigt':'Version 1.0 vom 26. Oktober 2021 gelesen und akzeptiert (Anhang)');

    if(sp.length){section('Fotodokumentation',170);await photos(sp);}
    need(40);y-=10;para(`Bestätigt in der Fahrzeug-App durch ${rec.who} am ${deDT(rec.at)}.`,9.5,C_MUTED);
    if(rec.sub!=='rueckgabe'&&rec.reglement!==false){
      newPage();text('Anhang',PDF_L,y,F,9.5,C_MUTED);y-=24;text('Dienstwagenreglement',PDF_L,y,FB,17);y-=20;text('Version 1.0, 26. Oktober 2021',PDF_L,y,F,9.5,C_MUTED);y-=10;
      REGLEMENT.forEach(s=>{need(46);y-=10;text(s.h,PDF_L,y,FB,10);y-=15;s.p.forEach(t0=>{para(t0,9.5);y-=3;});(s.l||[]).forEach(l=>para('–  '+l,9.5));});
      need(40);y-=12;para(`Akzeptiert durch ${rec.who} am ${deDT(rec.at)} in der Fahrzeug-App.`,9.5,C_MUTED);

  if(!ext&&rec.kind==='meldung'&&rec.third&&rec.third.file&&rec.third.file.type==='application/pdf'){try{const src=await PDFDocument.load(b64u8(rec.third.file.data.split(',')[1]),{ignoreEncryption:true});const cp=await doc.copyPages(src,src.getPageIndices());cp.forEach(pg=>doc.addPage(pg));}catch(e){}}
  pages.forEach((p,i)=>{p.drawText(safe(`${title} · ${rec.id} · Seite ${i+1} von ${pages.length}`),{x:PDF_L,y:88,font:F,size:7.5,color:col(C_MUTED)});});
  return {bytes:await doc.save(),filename:`${rec.id}_${title.split(' – ')[0].replace(/[^A-Za-z0-9ÄÖÜäöü]+/g,'-')}_${v.plate.replace(/\s/g,'')}.pdf`};
}

async function savePdf(id,ext){
  const rec=(S.history.find(h=>h.id===id))||(S.sampleRec&&S.sampleRec.id===id?S.sampleRec:null);if(!rec)return;
  if(!window.PDFLib){toast(t('pdf_err'));return;}
  toast(t('pdf_busy'));
  let out;try{out=await buildPdf(rec,{external:!!ext});}catch(e){console.error(e);toast(t('pdf_err'));return;}
  window.__lastPdf=out;
  const dl=window.claude&&window.claude.use?await window.claude.use('downloads').catch(()=>null):null;
  if(!dl){
    try{const url=URL.createObjectURL(new Blob([out.bytes],{type:'application/pdf'}));const a=document.createElement('a');a.href=url;a.download=out.filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast(t('pdf_ok'));}
    catch(e){toast(t('pdf_na'));}
    return;}
  try{await dl.save({filename:out.filename,data:new Blob([out.bytes],{type:'application/pdf'})});toast(t('pdf_ok'));}
  catch(e){if(e&&e.code==='declined'){S.toast=null;render();}else toast(e&&e.code==='rate_limited'?t('pdf_wait'):t('pdf_na'));}
}

  if(rec.kind==='tanken'){
    const e=rec.fuel==='strom',u=e?'kWh':'L';
    return Object.assign(base,{subject:`Tankprotokoll ${rec.id} · ${vehTxt} · ${plateTxt} · ${dDate(at)} · CHF ${rec.chf.toFixed(2)}`,
      html:mailShell(`<p style="margin:0 0 4px;font-size:18px;font-weight:bold">${e?'Neuer Ladevorgang':'Neuer Tankvorgang'}</p><p style="margin:0 0 12px;color:#6A7378">${eh(rec.who)} hat am ${dDate(at)} um ${dTime(at)} Uhr einen ${e?'Ladevorgang':'Tankvorgang'} erfasst.</p>`+
        mailRows([['Fahrzeug',eh(vehTxt)],['Kennzeichen',eh(plateTxt)],['Kilometerstand',rec.km!=null?fmtKm(rec.km)+' km':null],[e?'Energie':'Treibstoff',eh(I18N.de['fuel_'+rec.fuel])],['Menge',`${rec.liter.toFixed(1)} ${u}`],['Betrag',`<b>CHF ${rec.chf.toFixed(2)}</b>`],['Preis pro '+(e?'kWh':'Liter'),`CHF ${(rec.chf/rec.liter).toFixed(2)}`],['Mitarbeiter',eh(rec.who)],['Abteilung',rec.dept?eh(I18N.de['dept_'+rec.dept]):null],['Vorgang',rec.id]])+
        `<p style="margin:0">Das Tankprotokoll mit dem Foto der Quittung ist als PDF angehängt.</p>`)});
  }
  const typ=I18N.de['m_'+rec.sub];const prio=rec.prio?I18N.de['prio_'+rec.prio]:'';
  const what=rec.dmg?eh((rec.dmg.types||[]).filter(k=>k!=='andere').map(k=>I18N.de['d_'+k]).concat((rec.dmg.types||[]).includes('andere')?['Anderes']:[]).join(', ')):rec.flt?eh((rec.flt.types||[]).filter(k=>k!=='andere').map(k=>I18N.de['f_'+k]).concat((rec.flt.types||[]).includes('andere')?['Andere Meldung']:[]).join(', ')):null;
  const where=rec.dmg?eh((rec.dmg.where||[]).map(k=>I18N.de['p_'+k]).join(', ')):null;
  const desc=rec.dmg?rec.dmg.text:rec.flt?rec.flt.text:rec.note;
  const nPh=(rec.photos||[]).length;
  if(kind==='intern'){
    const ext=rulesFor(rec).filter(r=>r[1]==='extern').map(r=>MAIL_TO[r[0]]);
    const alarm=rec.prio==='sehrhoch';
    const banner=`<div style="background:${alarm?'#B8433A':rec.prio==='hoch'?'#FBEDEB':'#EEF8F9'};color:${alarm?'#fff':rec.prio==='hoch'?'#B8433A':'#177F80'};padding:10px 14px;border-radius:6px;font-weight:bold;margin-bottom:14px">${alarm?'Sofort bearbeiten: Unfall mit Drittperson':'Priorität '+eh(prio)}</div>`;
    return Object.assign(base,{subject:`${alarm?'SOFORT · ':''}${typ}${rec.unfall?' mit Drittperson':''} · Priorität ${prio} · ${vehTxt} · ${plateTxt} (${rec.id})`,
      html:mailShell(`<p style="margin:0 0 4px;font-size:18px;font-weight:bold">${eh(typ)}${rec.unfall?' – Unfall mit Drittperson':''}</p><p style="margin:0 0 12px;color:#6A7378">Gemeldet von ${eh(rec.who)} am ${dDate(at)} um ${dTime(at)} Uhr.</p>`+
        mailRows([['Fahrzeug',eh(vehTxt)],['Kennzeichen',eh(plateTxt)],['Kilometerstand',rec.km!=null?fmtKm(rec.km)+' km':null],[rec.dmg?'Schaden':rec.flt?'Anzeige':null,what],['Stelle am Fahrzeug',where],['Beschreibung',desc?eh(desc):null],['Ort',rec.sub==='schaden'?gpsLine:null],['Drittperson',rec.third?eh(`${rec.third.name}, ${rec.third.tel}${rec.third.kz?' · '+rec.third.kz:''}`):null],['Polizei / Protokoll',rec.third?`${rec.third.pol==='ja'?'Polizei vor Ort':'Keine Polizei'} · Protokoll ${rec.third.prot==='ja'?'ausgefüllt':'nicht ausgefüllt'}`:null],['Fotos',nPh?nPh+' im PDF':null],['Vorgang',rec.id]])+
        (ext.length?`<p style="margin:0 0 8px"><b>Automatisch informiert:</b> ${ext.map(x=>eh(x.label)+' ('+eh(x.addr)+')').join(', ')}</p>`:'')+
        `<p style="margin:0">Alle Angaben und Fotos sind im angehängten PDF. Status und Zuständigkeit werden in der Verwaltung der Fahrzeug-App gepflegt.</p>`,banner)});
  }
  // extern
  const T={schaden:['Schadenmeldung',`wir melden Ihnen einen Schaden an unserem Firmenfahrzeug und bitten Sie um Kontaktaufnahme für die Besichtigung, einen Kostenvoranschlag und einen Reparaturtermin.`],
    service:['Serviceanfrage',`bei unserem Firmenfahrzeug ist ein Service fällig. Wir bitten Sie um einen Terminvorschlag.`],
    fehler:['Fehlermeldung am Fahrzeug',`unser Firmenfahrzeug zeigt eine Fehlermeldung an. Wir bitten Sie um Prüfung und einen Terminvorschlag.`],
    bremsen:['Bremsen prüfen',`bei unserem Firmenfahrzeug sind die Bremsen fällig. Wir bitten Sie um Prüfung und einen Terminvorschlag.`]}[rec.sub];
  return Object.assign(base,{subject:`${T[0]} Fahrzeug ${plateTxt} (${v.model}) – Clean Service Scaramuzzo AG`,
    html:mailShell(`<p style="margin:0 0 12px">Sehr geehrte Damen und Herren</p><p style="margin:0 0 12px">${T[1]}</p>`+
      mailRows([['Fahrzeug',eh(v.model)],['Kennzeichen',eh(plateTxt)],['Kilometerstand',rec.km!=null?fmtKm(rec.km)+' km':null],[rec.dmg?'Schaden':rec.flt?'Anzeige':null,what],['Stelle am Fahrzeug',where],['Beschreibung',desc?eh(desc):null],['Gemeldet am',dDate(at)],['Unsere Referenz',rec.id]])+
      `<p style="margin:0 0 12px">${nPh?'Fotos und Protokoll finden Sie im PDF-Anhang. ':'Das Protokoll finden Sie im PDF-Anhang. '}Für Rückfragen und die Terminvereinbarung erreichen Sie uns unter 0844 355 355 oder info@clean-service.ch.</p><p style="margin:0">Freundliche Grüsse<br><b>Clean Service Scaramuzzo AG</b></p>`)});
}
function mailsFor(rec){return rulesFor(rec).map(r=>Object.assign(mailFor(rec,r),{status:MAIL_ENDPOINT?'wartet':'offen'}));}
function u8b64(u){let s='';const ch=0x8000;for(let i=0;i<u.length;i+=ch)s+=String.fromCharCode.apply(null,u.subarray(i,i+ch));return btoa(s);}
async function sendMails(rec){
  rec.mails=mailsFor(rec);
  if(!MAIL_ENDPOINT||!window.PDFLib)return;
  for(const m of rec.mails){
    try{const pdf=await buildPdf(rec,{external:m.external});
      const r=await fetch(MAIL_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:m.to.join(';'),subject:m.subject,html:m.html,attachmentName:m.attach,attachmentBase64:u8b64(pdf.bytes)})});
      m.status=r.ok?'gesendet':'fehler';m.sentAt=new Date();if(!r.ok){try{const j=await r.json();m.err=j.error||('HTTP '+r.status);}catch(x){m.err='HTTP '+r.status;}}}
    catch(e){m.status='fehler';m.err='Keine Verbindung zum Versanddienst';}
  }
  if(S.account==='admin')render();
}
/* Beispiel-Datensätze nur für die Vorschau in der Verwaltung */
function sampleRec(kind){
  const v=VEH.find(x=>x.nr==='46')||VEH[0];const at=new Date();
  const b={id:'FZ-2026-VORSCHAU',veh:v.id,who:'Vorname Nachname',at,km:84500,prio:null,photos:[]};
  if(kind==='tanken')return Object.assign(b,{kind:'tanken',fuel:'diesel',liter:52.4,chf:98.6,dept:'spez'});
  const m=Object.assign(b,{kind:'meldung',sub:kind,status:'offen',assignee:null,log:[{at,who:b.who,text:'Meldung erfasst (Mitarbeiter-App)'}],prio:MTYPES[kind].prio});
  if(kind==='schaden')Object.assign(m,{dmg:{types:['kratzer','delle'],where:['heck'],text:'Beim Rückwärtsfahren Poller touchiert'},gps:{lat:47.4122,lon:8.6934,acc:12,at,addr:'Industriestrasse 5, 8307 Effretikon'}});
  if(kind==='fehler')Object.assign(m,{flt:{types:['motor'],text:''}});
  if(kind==='service'||kind==='pneu'||kind==='bremsen')m.note=kind==='bremsen'?'Quietschen beim Bremsen':kind==='pneu'?'Winterpneus montieren':'Serviceanzeige leuchtet';
  return m;
}
const MST={offen:'Vorbereitet – Versand noch nicht verbunden',wartet:'Wird gesendet …',gesendet:'Gesendet',fehler:'Fehler beim Senden'};
function mailList(rec,mails){
  return `<div class="mails">${mails.map((m,i)=>`<button class="mailrow" data-act="mailprev" data-id="${rec.id}" data-i="${i}"><span class="mail-ic">${ic('bell')}</span><span class="mail-b"><b>${eh(m.subject)}</b><small>An: ${eh(m.toLabel)} · ${eh(m.to.join(', '))} · ${m.kind==='extern'?'Extern':'Intern'}${m.err?' · '+eh(m.err):''}</small></span><span class="st ${m.status==='gesendet'?'st-erledigt':m.status==='fehler'?'st-offen':'st-bearbeitung'}">${MST[m.status]||''}</span></button>`).join('')}</div>`;
}
function mailModal(){
  const mm=S.modal;const rec=mm.sample?S.sampleRec:S.history.find(h=>h.id===mm.id);const m=(mm.sample?mailsFor(rec):rec.mails)[mm.i];
  return `<div class="scrim top" data-act="mclosemodal"></div><div class="modal mailmodal" role="dialog" aria-modal="true" aria-label="E-Mail-Vorschau">
  <div class="mm-h"><h2>E-Mail-Vorschau</h2><button class="iconbtn" data-act="mclosemodal" aria-label="Schliessen">${ic('x')}</button></div>
  <dl class="mm-meta"><div><dt>An</dt><dd>${eh(m.to.join(', '))} <span class="muted">(${eh(m.toLabel)})</span></dd></div><div><dt>Betreff</dt><dd><b>${eh(m.subject)}</b></dd></div><div><dt>Anhang</dt><dd><button class="linkbtn" data-act="pdf" data-id="${rec.id}" data-ext="${m.external?'1':'0'}">${ic('clip')} ${eh(m.attach)}</button>${m.external?' <span class="muted">(ohne interne Angaben)</span>':''}</dd></div></dl>
  <div class="mm-body">${m.html}</div></div>`;
}
Object.assign(A,{
  mailprev:b=>{S.modal={t:'mail',id:b.dataset.id,i:+b.dataset.i,sample:b.dataset.sample==='1'};render();},
  mailsample:b=>{S.sampleRec=sampleRec(b.dataset.k);S.modal={t:'mail',id:S.sampleRec.id,i:+b.dataset.i,sample:true};render();}
});

})();
</script>
